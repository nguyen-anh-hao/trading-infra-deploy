services:
  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
    networks:
      - default
      - trading-net

  redis-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "9121:9121"
    networks:
      - default
      - trading-net

  nats-exporter:
    image: natsio/prometheus-nats-exporter:latest
    command: ["-varz", "-connz", "-routez", "-subz", "http://nats:8222"]
    ports:
      - "7777:7777"
    networks:
      - default
      - trading-net

  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    command: ["--kafka.server=redpanda:29092"]
    ports:
      - "9308:9308"
    networks:
      - default
      - trading-net

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    ports:
      - "9115:9115"
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - default
      - trading-net

  postgres-exporter-orders:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: postgresql://settlement:settlement@postgres:5432/orders?sslmode=disable
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yaml
    volumes:
      - ./postgres-exporter/queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    ports:
      - "9188:9187"
    networks:
      - default
      - trading-net

  postgres-exporter-risk:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: postgresql://settlement:settlement@postgres:5432/risk?sslmode=disable
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yaml
    volumes:
      - ./postgres-exporter/queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    ports:
      - "9189:9187"
    networks:
      - default
      - trading-net

  timescale-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: postgresql://market_data:market_data@timescaledb:5432/market_data?sslmode=disable
    ports:
      - "9190:9187"
    networks:
      - default
      - trading-net

  alertmanager:
    image: prom/alertmanager:latest
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - trading-net

  prometheus:
    image: prom/prometheus:latest
    # --web.enable-remote-write-receiver lets Tempo's metrics-generator push the
    # span-metrics / service-graphs series that Traces Drilldown and the Tempo
    # Service Graph view read. The rest of the flags mirror the image defaults
    # (setting `command` replaces CMD entirely).
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/recording_rules.yml:/etc/prometheus/recording_rules.yml:ro
      - ./prometheus/recording_rules_baselines.yml:/etc/prometheus/recording_rules_baselines.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports:
      - "9090:9090"
    networks:
      - default
      - trading-net

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      # Jaeger >= 2.x already exposes the OTLP receiver (gRPC 4317 / HTTP 4318)
      # by default; keep it explicit so otel-collector can export to jaeger:4317.
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI; traces arrive from otel-collector over OTLP gRPC
    networks:
      - default

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./otel-collector/otel-config.yml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    networks:
      - default
      - trading-net

  pyroscope:
    image: grafana/pyroscope:latest
    # The image runs as a non-root user but needs to write /var/lib/pyroscope.
    user: root
    ports:
      - "4040:4040"
    volumes:
      - ./pyroscope/pyroscope.yml:/etc/pyroscope/config.yaml:ro
      - pyroscope-data:/var/lib/pyroscope
    networks:
      - default

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    ports:
      - "8079:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    privileged: true

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: postgresql://settlement:settlement@postgres:5432/settlement?sslmode=disable
      PG_EXPORTER_EXTEND_QUERY_PATH: /etc/postgres_exporter/queries.yaml
    volumes:
      - ./postgres-exporter/queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    ports:
      - "9187:9187"
    networks:
      - default
      - trading-net

  # Kafka message browser (topics / partitions / messages / consumer groups),
  # decoding Avro payloads through Schema Registry.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: redpanda:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    ports:
      - "8090:8080"
    networks:
      - default
      - trading-net

  loki:
    image: grafana/loki:3.7.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    networks:
      - default
      - trading-net

  # Tempo backs the Grafana Drilldown -> Traces app and the native trace
  # search / Service Graph views (Jaeger is not supported by those).
  tempo:
    image: grafana/tempo:latest
    command: ["-target=all", "-config.file=/etc/tempo.yml"]
    volumes:
      - ./tempo/tempo.yml:/etc/tempo.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200" # query API used by the Grafana Tempo data source
    networks:
      - default

  alloy:
    image: grafana/alloy:latest
    # Alloy 1.x CLI takes the config path as a positional arg to the `run` subcommand.
    command: run /etc/alloy/alloy-config.alloy
    volumes:
      - ./alloy/alloy-config.alloy:/etc/alloy/alloy-config.alloy:ro
      # Alloy's docker discovery tails logs via the Docker API, so it needs the socket.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default
      - trading-net
networks:
  default:
    driver: bridge
  trading-net:
    external: true

volumes:
  alertmanager-data:
  pyroscope-data:
  tempo-data: