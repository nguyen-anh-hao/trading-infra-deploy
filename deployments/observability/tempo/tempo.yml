stream_over_http_enabled: true

# Grafana Tempo (single binary) for local dev.
#
# Why this exists: Grafana "Drilldown -> Traces" (Traces Drilldown) and the
# native trace search / Service Graph views only talk to a **Tempo** data
# source. The Jaeger data source is NOT supported by the Drilldown app, which is
# why that page showed "No data" when only Jaeger was provisioned.
#
# The collector fans traces out to both Jaeger (Jaeger UI :16686) and Tempo
# (Grafana). No host ports 4317/4318 here on purpose - the collector already
# publishes them; Tempo is only reached in-network as tempo:4317.

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Turns spans into RED metrics + service graph edges and remote-writes them to
# Prometheus. Required for:
#   - Traces Drilldown RED panels (rate / errors / duration)
#   - the Service Graph view of the Tempo data source (node graph)
# Prometheus must run with --web.enable-remote-write-receiver.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors: [span-metrics, service-graphs]

usage_report:
  reporting_enabled: false
