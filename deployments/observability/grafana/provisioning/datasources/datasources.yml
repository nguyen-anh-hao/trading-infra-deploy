apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    url: http://prometheus:9090
    access: proxy
    isDefault: true
  - name: Jaeger
    uid: jaeger
    type: jaeger
    url: http://jaeger:16686
    access: proxy
  - name: Pyroscope
    type: grafana-pyroscope-datasource
    url: http://pyroscope:4040
    access: proxy
