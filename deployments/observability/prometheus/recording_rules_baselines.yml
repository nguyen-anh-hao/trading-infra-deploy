      baseline: go_gc_cpu_fraction
      title: Go GC CPU fraction
      category: saturation
      target: '0.05'
      comparator: le
      severity: warning
      unit: percentunit
  - record: baseline:violation
    expr: (go_memstats_gc_cpu_fraction) > bool 0.05
    labels:
      baseline: go_gc_cpu_fraction
