      category: saturation
      target: '0.05'
      comparator: le
      severity: warning
      unit: percentunit
  - record: baseline:value
    expr: histogram_quantile(0.99, sum by (service, le) (rate(jvm_gc_pause_seconds_bucket[5m])))
    labels:
      baseline: jvm_gc_pause_p99
      title: JVM GC pause p99
      category: saturation
      target: '0.2'
      comparator: le
      severity: warning
      unit: s
  - record: baseline:violation
    expr: (histogram_quantile(0.99, sum by (service, le) (rate(jvm_gc_pause_seconds_bucket[5m])))) > bool 0.2
    labels:
      baseline: jvm_gc_pause_p99
      title: JVM GC pause p99
      category: saturation
      target: '0.2'
      comparator: le
      severity: warning
      unit: s
  - record: baseline:value
    expr: hikaricp_connections_pending
    labels:
      baseline: hikari_pending
      title: Hikari pending connections
