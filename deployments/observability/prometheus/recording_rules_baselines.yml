groups:
- name: baseline-scorecard
  interval: 30s
  rules:
  - record: baseline:value
    expr: service:http_error_ratio5m
    labels:
      baseline: http_5xx_ratio
      title: HTTP 5xx ratio
      category: availability
      target: '0.005'
      comparator: le
      severity: critical
      unit: percentunit
  - record: baseline:violation
    expr: (service:http_error_ratio5m) > bool 0.005
    labels:
      baseline: http_5xx_ratio
      title: HTTP 5xx ratio
      category: availability
      target: '0.005'
      comparator: le
      severity: critical
      unit: percentunit
  - record: baseline:value
    expr: service:http_error_ratio1h
    labels:
      baseline: http_5xx_ratio_burn_fast
      title: Fast error-budget burn (1h)
      category: availability
      target: '0.072'
      comparator: le
      severity: critical
      unit: percentunit
  - record: baseline:violation
    expr: (service:http_error_ratio1h) > bool 0.072
    labels:
      baseline: http_5xx_ratio_burn_fast
      title: Fast error-budget burn (1h)
      category: availability
      target: '0.072'
      comparator: le
      severity: critical
      unit: percentunit
  - record: baseline:value
    expr: up{job=~"api-gateway|order-service|risk-engine|market-data-service|matching-engine|clearing-settlement|promotion-service|accounting-tax-service"}
    labels:
      baseline: scrape_up
      title: Scrape target up
      category: availability
      target: '1'
      comparator: ge
      severity: critical
      unit: short
  - record: baseline:violation
    expr: (up{job=~"api-gateway|order-service|risk-engine|market-data-service|matching-engine|clearing-settlement|promotion-service|accounting-tax-service"})
      < bool 1
    labels:
      baseline: scrape_up
      title: Scrape target up
      category: availability
      target: '1'
      comparator: ge
      severity: critical
      unit: short
  - record: baseline:value
    expr: scrape_duration_seconds{job=~"api-gateway|order-service|risk-engine|market-data-service|matching-engine|clearing-settlement|promotion-service|accounting-tax-service"}
    labels:
      baseline: scrape_duration
      title: Scrape duration
      category: availability
      target: '2.5'
      comparator: le
      severity: warning
      unit: s
  - record: baseline:violation
    expr: (scrape_duration_seconds{job=~"api-gateway|order-service|risk-engine|market-data-service|matching-engine|clearing-settlement|promotion-service|accounting-tax-service"})
      > bool 2.5
    labels:
      baseline: scrape_duration
      title: Scrape duration
      category: availability
      target: '2.5'
      comparator: le
      severity: warning
      unit: s
  - record: baseline:value
    expr: histogram_quantile(0.99, sum by (service, le) (rate(http_request_duration_seconds_bucket{service="order-service",path=~"/orders.*"}[5m])))
    labels:
      baseline: order_path_p99
      title: Order path p99
      category: latency
      target: '0.5'
      comparator: le
      severity: critical
      unit: s
  - record: baseline:violation
    expr: (histogram_quantile(0.99, sum by (service, le) (rate(http_request_duration_seconds_bucket{service="order-service",path=~"/orders.*"}[5m]))))
      > bool 0.5
    labels:
      baseline: order_path_p99
      title: Order path p99
      category: latency
      target: '0.5'
      comparator: le
      severity: critical
      unit: s
  - record: baseline:value
    expr: service:http_request_duration_seconds:p99
    labels:
      baseline: http_p99
      title: HTTP p99
      category: latency
      target: '1'
      comparator: le
      severity: warning
      unit: s
  - record: baseline:violation
    expr: (service:http_request_duration_seconds:p99) > bool 1
    labels:
      baseline: http_p99
      title: HTTP p99
      category: latency
      target: '1'
      comparator: le
      severity: warning
      unit: s
  - record: baseline:value
    expr: histogram_quantile(0.99, sum by (service, le) (rate(trading_matching_latency_seconds_bucket[5m])))
    labels:
      baseline: matching_p99
      title: Matching engine p99
      category: latency
      target: '0.005'
      comparator: le
      severity: critical
      unit: s
  - record: baseline:violation
    expr: (histogram_quantile(0.99, sum by (service, le) (rate(trading_matching_latency_seconds_bucket[5m])))) > bool 0.005
    labels:
      baseline: matching_p99
      title: Matching engine p99
      category: latency
      target: '0.005'
      comparator: le
      severity: critical
      unit: s
  - record: baseline:value
    expr: histogram_quantile(0.999, sum by (service, le) (rate(trading_matching_latency_seconds_bucket[5m])))
    labels:
      baseline: matching_p999
      title: Matching engine p999
      category: latency
      target: '0.01'
      comparator: le
      severity: warning
      unit: s
  - record: baseline:violation
    expr: (histogram_quantile(0.999, sum by (service, le) (rate(trading_matching_latency_seconds_bucket[5m])))) > bool 0.01
    labels:
      baseline: matching_p999
      title: Matching engine p999
      category: latency
      target: '0.01'
      comparator: le
      severity: warning
      unit: s
  - record: baseline:value
    expr: service:http_request_duration_seconds:p99 / clamp_min(service:http_request_duration_seconds:p50, 0.0001)
    labels:
      baseline: tail_ratio_p99_p50
      title: HTTP p99/p50 tail ratio
      category: latency
      target: '5'
      comparator: le
      severity: warning
      unit: short
  - record: baseline:violation
    expr: (service:http_request_duration_seconds:p99 / clamp_min(service:http_request_duration_seconds:p50, 0.0001)) > bool
      5
    labels:
      baseline: tail_ratio_p99_p50
      title: HTTP p99/p50 tail ratio
      category: latency
      target: '5'
      comparator: le
      severity: warning
      unit: short
  - record: baseline:value
    expr: histogram_quantile(0.99, sum by (service, le) (rate(trading_market_ws_send_duration_seconds_bucket[5m])))
    labels:
      baseline: ws_send_p99
      title: Tick -> WebSocket p99
      category: latency
      target: '0.1'
      comparator: le
      severity: warning
      unit: s
  - record: baseline:violation
    expr: (histogram_quantile(0.99, sum by (service, le) (rate(trading_market_ws_send_duration_seconds_bucket[5m])))) > bool
      0.1
    labels:
      baseline: ws_send_p99
      title: Tick -> WebSocket p99
      category: latency
      target: '0.1'
      comparator: le
      severity: warning
      unit: s
  - record: baseline:value
    expr: service:cpu:throttled_ratio5m
    labels:
      baseline: cpu_throttled_ratio
      title: CFS throttled periods ratio
      category: saturation
      target: '0.01'
      comparator: le
      severity: warning
      unit: percentunit
  - record: baseline:violation
    expr: (service:cpu:throttled_ratio5m) > bool 0.01
    labels:
      baseline: cpu_throttled_ratio
