global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: api-gateway
    static_configs:
      - targets: ["api-gateway:8080"]
  - job_name: risk-engine
    static_configs:
      - targets: ["risk-engine:9002"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
