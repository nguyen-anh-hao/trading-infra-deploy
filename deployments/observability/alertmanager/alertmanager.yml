global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "service", "job"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default
  routes:
    - matchers:
        - severity="critical"
      receiver: default
      repeat_interval: 1h

receivers:
  - name: default
    # Wire a real webhook/Slack/PagerDuty receiver here. The empty receiver is
    # intentional so local runs do not send traffic outside the host.
    webhook_configs:
      - url: http://host.docker.internal:5001/alerts
        send_resolved: true
        max_alerts: 0

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: ["alertname", "service", "job"]
