apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: trading-system
data:
  POSTGRES_HOST: postgres
  POSTGRES_DB: settlement
  POSTGRES_USER: settlement
  POSTGRES_PASSWORD: settlement
  REDIS_ADDR: redis:6379
  ORDERS_DB_DSN: postgres://settlement:settlement@postgres:5432/orders?sslmode=disable
  RISK_DB_DSN: postgres://settlement:settlement@postgres:5432/risk?sslmode=disable
  SCHEMA_REGISTRY_URL: http://schema-registry:8081
  MATCHING_ENGINE_ADDR: matching-engine:9001
  RISK_ENGINE_ADDR: risk-engine:9002
  SETTLEMENT_ADDR: clearing-settlement:8083
  PROMOTION_ADDR: promotion-service:8084
  KAFKA_BOOTSTRAP_SERVERS: kafka-bootstrap:9092
  TAX_RATE: "0.10"
  ORDER_SERVICE_ADDR: order-service:8087
  MARKET_DATA_ADDR: market-data-service:8085
  NATS_ADDR: nats:4222
  INTERNAL_API_TOKEN: change-me-in-production
  WS_TICKER_POLL_MS: "500"
  ACCOUNTING_OUTBOX_ENABLED: "true"
