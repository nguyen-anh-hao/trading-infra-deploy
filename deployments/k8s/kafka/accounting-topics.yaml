apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: accounting-trade
  namespace: trading-system
  labels:
    strimzi.io/cluster: trading-kafka
spec:
  topicName: accounting.trade
  partitions: 3
  replicas: 3
  config:
    cleanup.policy: delete
    retention.ms: 604800000
