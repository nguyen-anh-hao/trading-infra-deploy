apiVersion: apps/v1
kind: Deployment
metadata:
  name: promotion-service
  namespace: trading-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: promotion-service
  template:
    metadata:
      labels:
        app: promotion-service
    spec:
      containers:
        - name: promotion-service
          image: promotion-service:latest
          ports:
            - containerPort: 8084
          livenessProbe:
            httpGet:
              path: /fee-tiers
              port: 8084
---
apiVersion: v1
kind: Service
metadata:
  name: promotion-service
  namespace: trading-system
spec:
  selector:
    app: promotion-service
  ports:
    - port: 8084
      targetPort: 8084
