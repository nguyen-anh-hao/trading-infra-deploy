apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: trading-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: ghcr.io/nguyen-anh-hao/order-service:latest
          ports:
            - containerPort: 8087
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: ORDER_SERVICE_PORT
              value: "8087"
          livenessProbe:
            httpGet:
              path: /health
              port: 8087
          readinessProbe:
            httpGet:
              path: /health
              port: 8087
          startupProbe:
            httpGet:
              path: /health
              port: 8087
            failureThreshold: 30
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: trading-system
spec:
  selector:
    app: order-service
  ports:
    - port: 8087
      targetPort: 8087
