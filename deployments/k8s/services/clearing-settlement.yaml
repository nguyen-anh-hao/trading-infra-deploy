apiVersion: apps/v1
kind: Deployment
metadata:
  name: clearing-settlement
  namespace: trading-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clearing-settlement
  template:
    metadata:
      labels:
        app: clearing-settlement
    spec:
      containers:
        - name: clearing-settlement
          image: ghcr.io/nguyen-anh-hao/clearing-settlement:latest
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: app-config
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8083
            failureThreshold: 60
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: clearing-settlement
  namespace: trading-system
spec:
  selector:
    app: clearing-settlement
  ports:
    - port: 8083
      targetPort: 8083
