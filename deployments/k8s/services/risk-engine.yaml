apiVersion: apps/v1
kind: Deployment
metadata:
  name: risk-engine
  namespace: trading-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: risk-engine
  template:
    metadata:
      labels:
        app: risk-engine
    spec:
      containers:
        - name: risk-engine
          image: ghcr.io/nguyen-anh-hao/risk-engine:latest
          ports:
            - containerPort: 9002
          envFrom:
            - configMapRef:
                name: app-config
          livenessProbe:
            httpGet:
              path: /health
              port: 9002
---
apiVersion: v1
kind: Service
metadata:
  name: risk-engine
  namespace: trading-system
spec:
  selector:
    app: risk-engine
  ports:
    - port: 9002
      targetPort: 9002
