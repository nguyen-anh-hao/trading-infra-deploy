apiVersion: apps/v1
kind: Deployment
metadata:
  name: matching-engine
  namespace: trading-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matching-engine
  template:
    metadata:
      labels:
        app: matching-engine
    spec:
      containers:
        - name: matching-engine
          image: matching-engine:latest
          ports:
            - containerPort: 9001
          resources:
            requests:
              cpu: "1"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: matching-engine
  namespace: trading-system
spec:
  selector:
    app: matching-engine
  ports:
    - port: 9001
      targetPort: 9001
