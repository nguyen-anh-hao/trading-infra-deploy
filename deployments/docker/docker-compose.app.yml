services:
  matching-engine:
    image: ghcr.io/nguyen-anh-hao/matching-engine:latest
    ports:
      - "9001:9001"
    environment:
      LOG_LEVEL: warn
      APP_ENV: production
    networks:
      - default
      - trading-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9001/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  risk-engine:
    image: ghcr.io/nguyen-anh-hao/risk-engine:latest
    ports:
      - "9002:9002"
    environment:
      REDIS_ADDR: redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_SERVICE_NAME: risk-engine
      LOG_LEVEL: info
      APP_ENV: production
    networks:
      - default
      - trading-net

  clearing-settlement:
    image: ghcr.io/nguyen-anh-hao/clearing-settlement:latest
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/settlement
      SPRING_DATASOURCE_USERNAME: settlement
      SPRING_DATASOURCE_PASSWORD: settlement
      # Must point at the in-network registry: the app default (localhost:8081)
      # is unreachable from inside the container, which makes Avro serialization
      # of outbox events fail and leaves Kafka with zero messages/schemas.
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      OTLP_TRACING_ENDPOINT: http://otel-collector:4318/v1/traces
      OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
      LOG_LEVEL: info
      APP_ENV: production
    networks:
      - default
      - trading-net

  promotion-service:
    image: ghcr.io/nguyen-anh-hao/promotion-service:latest
    ports:
      - "8084:8084"
    environment:
      OTEL_SERVICE_NAME: promotion-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      LOG_LEVEL: info
      APP_ENV: production
    networks:
      - default
      - trading-net

  market-data-service:
    image: ghcr.io/nguyen-anh-hao/market-data-service:latest
    ports:
      - "8085:8085"
    environment:
      NATS_ADDR: nats:4222
      REDIS_ADDR: redis:6379
      TIMESCALE_DSN: postgres://market_data:market_data@timescaledb:5432/market_data?sslmode=disable
      MATCHING_ENGINE_ADDR: matching-engine:9001
      WS_TICKER_POLL_MS: "500"
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_SERVICE_NAME: market-data-service
      LOG_LEVEL: warn
      APP_ENV: production
    depends_on:
      matching-engine:
        condition: service_started
    networks:
      - default
      - trading-net

  order-service:
    image: ghcr.io/nguyen-anh-hao/order-service:latest
    ports:
      - "8087:8087"
    environment:
      MATCHING_ENGINE_ADDR: matching-engine:9001
      RISK_ENGINE_ADDR: risk-engine:9002
      SETTLEMENT_ADDR: clearing-settlement:8083
      PROMOTION_ADDR: promotion-service:8084
      REDIS_ADDR: redis:6379
      NATS_ADDR: nats:4222
      INTERNAL_API_TOKEN: change-me-in-production
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_SERVICE_NAME: order-service
      LOG_LEVEL: warn
      APP_ENV: production
    depends_on:
      matching-engine:
        condition: service_healthy
      risk-engine:
        condition: service_started
      clearing-settlement:
        condition: service_started
      promotion-service:
        condition: service_started
    networks:
      - default
      - trading-net

  api-gateway:
    image: ghcr.io/nguyen-anh-hao/api-gateway:latest
    ports:
      - "8080:8080"
    environment:
      REDIS_ADDR: redis:6379
      RISK_ENGINE_ADDR: risk-engine:9002
      SETTLEMENT_ADDR: clearing-settlement:8083
      PROMOTION_ADDR: promotion-service:8084
      MARKET_DATA_ADDR: market-data-service:8085
      ORDER_SERVICE_ADDR: order-service:8087
      INTERNAL_API_TOKEN: change-me-in-production
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      RATE_LIMIT_PER_SEC: "10000"
      OTEL_SERVICE_NAME: api-gateway
      LOG_LEVEL: warn
      APP_ENV: production
    depends_on:
      matching-engine:
        condition: service_healthy
      risk-engine:
        condition: service_started
      clearing-settlement:
        condition: service_started
      promotion-service:
        condition: service_started
      market-data-service:
        condition: service_started
      order-service:
        condition: service_started
    networks:
      - default
      - trading-net

  accounting-tax-service:
    image: ghcr.io/nguyen-anh-hao/accounting-tax-service:latest
    ports:
      - "8086:8086"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      REDIS_ADDR: redis:6379
      TAX_RATE: "0.10"
      LOG_LEVEL: info
      APP_ENV: production
    networks:
      - default
      - trading-net

networks:
  default:
    driver: bridge
  trading-net:
    external: true
