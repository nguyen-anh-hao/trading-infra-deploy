services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: settlement
      POSTGRES_USER: settlement
      POSTGRES_PASSWORD: settlement
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - default
      - trading-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U settlement -d settlement"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - default
      - trading-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222", "-sd", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - natsdata:/data
    networks:
      - default
      - trading-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: market_data
      POSTGRES_USER: market_data
      POSTGRES_PASSWORD: market_data
    ports:
      - "5433:5432"
    volumes:
      - tsdata:/var/lib/postgresql/data
      - ../marketdata/init:/docker-entrypoint-initdb.d:ro
    networks:
      - default
      - trading-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market_data -d market_data"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  tsdata:
  natsdata:

networks:
  default:
    driver: bridge
  trading-net:
    external: true
