services:
  postgres:
    image: postgres:16
    # Three Debezium Postgres connectors (settlement, orders, risk) each need
    # their own logical replication slot and WAL sender connection.
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment:
      POSTGRES_DB: settlement
      POSTGRES_USER: settlement
      POSTGRES_PASSWORD: settlement
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - default
      - trading-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U settlement -d settlement"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - default
      - trading-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222", "-sd", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - natsdata:/data
    networks:
      - default
      - trading-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: market_data
      POSTGRES_USER: market_data
      POSTGRES_PASSWORD: market_data
    ports:
      - "5433:5432"
    volumes:
      - tsdata:/var/lib/postgresql/data
      - ../marketdata/init:/docker-entrypoint-initdb.d:ro
    networks:
      - default
      - trading-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market_data -d market_data"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # Kafka event backbone (Redpanda for local dev) + Confluent Schema Registry +
  # Debezium Kafka Connect (tails the outbox table -> Kafka).
  # ---------------------------------------------------------------------------
  redpanda:
    image: redpandadata/redpanda:v24.2.18
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    networks:
      - default
      - trading-net
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info --brokers localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://redpanda:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
    ports:
      - "8081:8081"
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - default
      - trading-net

  connect:
    build:
      context: ./connect
    environment:
      CONNECT_BOOTSTRAP_SERVERS: redpanda:29092
      CONNECT_GROUP_ID: "1"
      CONNECT_CONFIG_STORAGE_TOPIC: connect_configs
      CONNECT_OFFSET_STORAGE_TOPIC: connect_offsets
      CONNECT_STATUS_STORAGE_TOPIC: connect_status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: "1"
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: io.debezium.converters.BinaryDataConverter
      CONNECT_VALUE_CONVERTER_DELEGATE_CONVERTER_TYPE: io.confluent.connect.avro.AvroConverter
      CONNECT_VALUE_CONVERTER_DELEGATE_CONVERTER_TYPE_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      # Required by the image's healthcheck script, which probes
      # http://$CONNECT_REST_ADVERTISED_HOST_NAME:$CONNECT_REST_PORT/connectors.
      # Without it the probe hits port 80 and Connect stays "unhealthy".
      CONNECT_REST_PORT: 8083
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
    ports:
      # Host port 18083 (not 8083) so the Connect REST API does not clash with
      # clearing-settlement, which owns 8083 on the host. Same convention as
      # clearing-settlement/deployments/docker/docker-compose.dev.yml.
      - "18083:8083"
    depends_on:
      redpanda:
        condition: service_healthy
      schema-registry:
        condition: service_started
    networks:
      - default
      - trading-net

  connect-init:
    image: curlimages/curl:8.6.0
    depends_on:
      connect:
        condition: service_started
    volumes:
      # Config-only payload (no {"name","config"} wrapper): used with
      # PUT /connectors/<name>/config, which creates OR updates the connector so
      # config changes are applied on every boot.
      - ./connect/outbox-connector.json:/connector.json:ro
      - ./connect/orders-outbox-connector.json:/orders-connector.json:ro
      - ./connect/risk-outbox-connector.json:/risk-connector.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        until curl -fsS http://connect:8083/connectors >/dev/null 2>&1; do
          echo "waiting for connect..."; sleep 3;
        done;
        echo -n "outbox connector upsert HTTP ";
        curl -s -o /dev/null -w "%{http_code}\n" -X PUT
        -H "Content-Type: application/json"
        --data @/connector.json
        http://connect:8083/connectors/settlement-outbox-connector/config;
        curl -s http://connect:8083/connectors/settlement-outbox-connector/status;
        echo;
        echo -n "orders outbox connector upsert HTTP ";
        curl -s -o /dev/null -w "%{http_code}\n" -X PUT
        -H "Content-Type: application/json"
        --data @/orders-connector.json
        http://connect:8083/connectors/orders-outbox-connector/config;
        curl -s http://connect:8083/connectors/orders-outbox-connector/status;
        echo;
        echo -n "risk outbox connector upsert HTTP ";
        curl -s -o /dev/null -w "%{http_code}\n" -X PUT
        -H "Content-Type: application/json"
        --data @/risk-connector.json
        http://connect:8083/connectors/risk-outbox-connector/config;
        curl -s http://connect:8083/connectors/risk-outbox-connector/status;
        echo
    networks:
      - default
      - trading-net

  # One-shot bootstrap: pre-create every topic `accounting-tax-service` consumes
  # (plus its `.DLT` dead-letter twins). Kafka Streams fails permanently with
  # INCOMPLETE_SOURCE_TOPIC_METADATA if a source topic is missing at startup, so
  # the topics must exist before the service boots. Mirrors
  # accounting-tax-service/deployments/docker/docker-compose.dev.yml.
  topic-init:
    image: redpandadata/redpanda:v24.2.18
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        for t in accounting.trade accounting.ledger accounting.deposit accounting.withdrawal orders.events risk.events; do
          rpk topic create "$$t" --brokers redpanda:29092 -p 1 -r 1 || true;
          rpk topic create "$$t.DLT" --brokers redpanda:29092 -p 1 -r 1 || true;
        done;
        echo "accounting topics ready";
        rpk topic list --brokers redpanda:29092
    networks:
      - default
      - trading-net

volumes:
  pgdata:
  tsdata:
  natsdata:
  redisdata:

networks:
  default:
    driver: bridge
  trading-net:
    external: true
